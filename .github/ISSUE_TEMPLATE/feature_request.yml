name: Feature request / 功能建议 / 功能建議
description: Suggest a focused improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and affected systems / 替代方案与涉及的系统
